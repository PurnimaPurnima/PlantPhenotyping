<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8f5">
    <title>Upload an image</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202820;
        background: #f6f8f5;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      main {
        width: min(100%, 560px);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #477652;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 2.7rem);
        letter-spacing: -0.045em;
      }

      .intro {
        margin: 12px 0 28px;
        color: #667066;
        line-height: 1.6;
      }

      .upload-card {
        padding: 28px;
        border: 1px solid #e2e8e0;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(35 54 36 / 7%);
      }

      .drop-zone {
        min-height: 250px;
        display: grid;
        place-items: center;
        padding: 28px;
        border: 1.5px dashed #b7c9b7;
        border-radius: 14px;
        background: #fbfdfb;
        text-align: center;
        transition: border-color 160ms ease, background-color 160ms ease;
      }

      .drop-zone.is-dragging {
        border-color: #397a47;
        background: #f1f8f1;
      }

      .drop-zone.has-image {
        padding: 12px;
      }

      .upload-icon {
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: #eaf3e9;
        color: #397a47;
      }

      .upload-icon svg {
        width: 26px;
        height: 26px;
      }

      .drop-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 650;
      }

      .drop-hint {
        margin: 7px 0 16px;
        color: #778077;
        font-size: 0.875rem;
      }

      .browse-button,
      .submit-button {
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 650;
        cursor: pointer;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .browse-button {
        background: #eaf3e9;
        color: #2e6539;
      }

      .browse-button:hover {
        background: #dcebdc;
      }

      .browse-button:active,
      .submit-button:active {
        transform: translateY(1px);
      }

      .file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      .file-input:focus-visible + .browse-button {
        outline: 3px solid #76a77e;
        outline-offset: 3px;
      }

      .preview {
        display: none;
        width: 100%;
        max-height: 320px;
        border-radius: 9px;
        object-fit: contain;
      }

      .file-details {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 18px;
      }

      .file-name {
        overflow: hidden;
        margin: 0;
        color: #354035;
        font-size: 0.9rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .remove-button {
        flex: 0 0 auto;
        padding: 6px 0 6px 8px;
        border: 0;
        background: transparent;
        color: #737d73;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .remove-button:hover {
        color: #a13838;
      }

      .submit-button {
        width: 100%;
        margin-top: 22px;
        background: #397a47;
        color: #fff;
      }

      .submit-button:hover:not(:disabled) {
        background: #2e6539;
      }

      .submit-button:disabled {
        background: #b8c7b9;
        cursor: not-allowed;
      }

      .status {
        min-height: 1.25em;
        margin: 12px 0 0;
        color: #a13838;
        font-size: 0.85rem;
      }

      .fine-print {
        margin: 18px 0 0;
        color: #858d85;
        font-size: 0.78rem;
        text-align: center;
      }

      @media (max-width: 480px) {
        .upload-card {
          padding: 18px;
        }

        .drop-zone {
          min-height: 220px;
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Image upload</p>
      <h1>Add an image</h1>
      <p class="intro">Choose an image from your device or drag it into the area below to get started.</p>

      <form class="upload-card" id="upload-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="drop-zone" id="drop-zone">
          <div id="empty-state">
            <div class="upload-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"></path>
                <path d="M5 14.5v4A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-4"></path>
              </svg>
            </div>
            <p class="drop-title">Drag and drop your image here</p>
            <p class="drop-hint">or browse files on your device</p>
            <input class="file-input" id="image-file" name="image" type="file" accept="image/*" aria-label="Choose an image">
            <label class="browse-button" for="image-file">Choose image</label>
          </div>
          <img class="preview" id="image-preview" alt="Selected image preview">
        </div>

        <div class="file-details" id="file-details">
          <p class="file-name" id="file-name"></p>
          <button class="remove-button" id="remove-image" type="button">Remove</button>
        </div>
        <p class="status" id="upload-status" role="status" aria-live="polite">{{ upload_status }}</p>
        <button class="submit-button" id="upload-button" type="submit" disabled>Upload image</button>
        <p class="fine-print">Select an image file from your device.</p>
      </form>
    </main>

    <script>
      const form = document.querySelector("#upload-form");
      const fileInput = document.querySelector("#image-file");
      const dropZone = document.querySelector("#drop-zone");
      const emptyState = document.querySelector("#empty-state");
      const preview = document.querySelector("#image-preview");
      const fileDetails = document.querySelector("#file-details");
      const fileName = document.querySelector("#file-name");
      const removeButton = document.querySelector("#remove-image");
      const uploadButton = document.querySelector("#upload-button");
      const status = document.querySelector("#upload-status");
      let previewUrl;

      function clearImage() {
        fileInput.value = "";
        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = undefined;
        }
        preview.removeAttribute("src");
        preview.style.display = "none";
        emptyState.style.display = "block";
        fileDetails.style.display = "none";
        dropZone.classList.remove("has-image");
        uploadButton.disabled = true;
        status.textContent = "";
      }

      function showImage(file) {
        if (!file) return;
        if (!file.type.startsWith("image/")) {
          clearImage();
          status.textContent = "Please choose a valid image file.";
          return;
        }

        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(file);
        preview.src = previewUrl;
        preview.style.display = "block";
        emptyState.style.display = "none";
        fileDetails.style.display = "flex";
        fileName.textContent = file.name;
        dropZone.classList.add("has-image");
        uploadButton.disabled = false;
        status.textContent = "";
      }

      fileInput.addEventListener("change", () => showImage(fileInput.files[0]));
      removeButton.addEventListener("click", clearImage);

      for (const eventName of ["dragenter", "dragover"]) {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.add("is-dragging");
        });
      }

      for (const eventName of ["dragleave", "drop"]) {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.remove("is-dragging");
        });
      }

      dropZone.addEventListener("drop", (event) => {
        const [file] = event.dataTransfer.files;
        if (!file) return;
        const transfer = new DataTransfer();
        transfer.items.add(file);
        fileInput.files = transfer.files;
        showImage(file);
      });

      form.addEventListener("submit", (event) => {
        if (!fileInput.files.length) {
          event.preventDefault();
          status.textContent = "Choose an image before uploading.";
        }
      });
    </script>
  </body>
</html>
